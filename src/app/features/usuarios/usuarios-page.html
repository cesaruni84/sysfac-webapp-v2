@if (usuario(); as u) {
  <div class="grid gap-4 md:grid-cols-2">
    <p-card [header]="nombreCompleto()" subheader="Usuario">
      <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2" data-testid="datos-usuario">
        @for (c of datosUsuario(); track c.etiqueta) {
          <dt class="font-semibold">{{ c.etiqueta }}</dt>
          <dd>{{ c.valor || '-' }}</dd>
        }
      </dl>
    </p-card>
    <p-card header="Empresa" [subheader]="u.empresa.comercial">
      <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2" data-testid="datos-empresa">
        @for (c of datosEmpresa(); track c.etiqueta) {
          <dt class="font-semibold">{{ c.etiqueta }}</dt>
          <dd>{{ c.valor || '-' }}</dd>
        }
      </dl>
    </p-card>
  </div>
} @else {
  <p data-testid="sin-sesion">No hay una sesión activa.</p>
}
